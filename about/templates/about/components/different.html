<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card border-0 shadow-lg overflow-hidden" style="border-radius: 20px; background-color: rgba(255, 193, 154, 0.87);">
                <div class="row g-0 align-items-center p-5">
                    
                    <div class="col-md-7">
                        <div class="card-body p-4 p-lg-5">
                            <h1 class="fw-bold mb-4 text-primary" style="letter-spacing: -1px;">
                                {{ different.title }}
                            </h1>
                            <div class="card-text text-muted" style="white-space: pre-line; line-height: 1.8; font-size: 1.1rem;">
                                {{ different.desc_1|linebreaksbr }}
                            </div>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <div class="h-100">
                            <img src="{{ different.image_1.url }}" 
                                 alt="{{ different.title }}" 
                                 class="img-fluid h-100 w-100" 
                                 style="object-fit: cover; min-height: 350px;;
                                 border-radius: 30px;">
                        </div>
                    </div>

                </div>
            </div>
            </div>
    </div>
</div>
