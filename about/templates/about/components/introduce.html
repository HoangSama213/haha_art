<!-- Về chúng tôi -->
<div class="container-xxl py-5">
    <div class="container">
        <div class="row g-5 align-items-center">
            <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.1s">
                <h1 class="mb-4">{{ about.title }}</h1>
                <p>{{ about.desc_1 }}</p>
                <p>{{ about.desc_2 }}</p>
                <p>{{ about.desc_3 }}</p>
                <p>{{ about.desc_4 }}</p>
                <p class="mb-4">{{ about.desc_5 }}</p>
                <div class="row g-4 align-items-center">
                    <div class="col-sm-6">
                        <a class="btn btn-primary rounded-pill py-3 px-5" href="">Tìm hiểu thêm</a>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 about-img wow fadeInUp" data-wow-delay="0.5s">
                <div class="row">
                    <div class="col-12 text-center">
                        {% if about.image_1 %}
                            <img class="img-fluid w-75 rounded-circle bg-light p-3" src="{{ about.image_1.url }}" alt="">
                        {% endif %}
                    </div>
                    <div class="col-6 text-start" style="margin-top: -150px;">
                        {% if about.image_2 %}
                            <img class="img-fluid w-100 rounded-circle bg-light p-3" src="{{ about.image_2.url }}" alt="">
                        {% endif %}
                    </div>
                    <div class="col-6 text-end" style="margin-top: -150px;">
                        {% if about.image_3 %}
                            <img class="img-fluid w-100 rounded-circle bg-light p-3" src="{{ about.image_3.url }}" alt="">
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
