<!-- Team Start -->
<div class="container-xxl py-5">
    <div class="container">
        <div class="text-center mx-auto mb-5 wow fadeInUp" data-wow-delay="0.1s" style="max-width: 600px;">
            <h1 class="mb-3">Đội ngũ giáo viên</h1>
            <p>Đội ngũ giáo viên nhiệt huyết đầy kinh nghiệm</p>
        </div>
        <div class="row g-4">
            {% for t in teacher %}
            <div class="col-lg-4 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                <div class="team-item position-relative">
                    <img class="img-fluid rounded-circle w-75" src="{{ t.photo.url }}" alt="{{ t.name }}">
                    <div class="team-text ">
                        <h3>{{ t.name }}</h3>
                        <p>{{ t.position }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
<!-- Team End -->
