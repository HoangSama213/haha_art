<!-- Quy chế đào tạo -->
<div class="container-xxl py-5">
    <div class="container">
        <div class="bg-light rounded">
            <div class="row g-0">
                <div class="col-lg-6 wow fadeIn" data-wow-delay="0.1s" style="min-height: 400px;">
                    <div class="position-relative h-100">
                        {% if policy.image %}
                            <img class="position-absolute w-100 h-100 rounded" src="{{ policy.image.url }}" style="object-fit: cover;">
                        {% endif %}
                    </div>
                </div>
                <div class="col-lg-6 wow fadeIn" data-wow-delay="0.5s">
                    <div class="h-100 d-flex flex-column justify-content-center p-5">
                        <h1 class="mb-4">{{ policy.title }}</h1>
                        <p class="mb-4">{{ policy.content }}</p>
                        <a class="btn btn-primary py-3 px-5" href="{% url 'about:aboutus' %}">Tìm hiểu ngay<i class="fa fa-arrow-right ms-2"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
