<div class="main">

    <h1 class="text-center" style="color:#fe5d37">Tác phẩm của bé</h1>
    <p class="text-center">Những tác phẩm tiêu biểu của các bé học viên ở HAHA ART</p>
    <div class="carousel-container">
        <div class="owl-carousel product-carousel owl-theme">
            {% for p in products %}
            <div class="item mx-5">
                <div class="product-img">
                    <img src="{{ p.images.url }}" alt="{{ p.title }}">
                </div>
                <h3 class="text-center">{{ p.title }}</h3>
            </div>
            {% empty %}
                <p>không thấy sản phẩm nào</p>
            {% endfor %}

        </div>
    </div>
</div>
<style>
    .product-img {
    width: 100%;      /* fix chiều cao */
    overflow: hidden;
    border-radius: 10px;
}

.product-img img {
    width: 100%;
    min-height: 312px;
    border-radius: 30px;
    border: 5px solid #fe5d37;}

</style>
